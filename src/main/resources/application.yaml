spring:
  application:
    name: backoffice-approval

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:backoffice_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:backoffice_user}
    password: ${DB_PASSWORD:backoffice_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Best practice: schema is owned by Flyway migrations, not Hibernate.
      # "validate" makes Hibernate check the entities match the DB schema and fail fast if not.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # In real deployments this MUST come from an env var / secret manager, never committed.
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    '[com.senfin.backoffice]': INFO
    '[org.springframework.security]': WARN
