spring:
  application:
    name: backoffice-approval

  main:
    banner-mode: off # skip the ASCII-art banner on every startup

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:backoffice_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:backoffice_user}
    password: ${DB_PASSWORD:backoffice_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false # silences the "enabled by default" nag; see README for the tradeoff
    hibernate:
      # Best practice: schema is owned by Flyway migrations, not Hibernate.
      # "validate" makes Hibernate check the entities match the DB schema and fail fast if not.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
        # No explicit dialect: Hibernate 7 auto-detects it from the JDBC connection
        # (and forcing MySQLDialect here was also wrong for the H2 test profile).

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # In real deployments this MUST come from an env var / secret manager, never committed.
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

springdoc:
  api-docs:
    enabled: true # explicit, so Spring stops nagging that it's "enabled by default"
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    "[com.senfin.backoffice_approval]": INFO
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR
